<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mushroom Gaming</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #f0f0f0;
      padding: 50px;
    }
    h1 {
      margin-bottom: 40px;
    }
    .game-link {
      display: block;
      margin: 20px;
      font-size: 20px;
      text-decoration: none;
      color: #2c3e50;
      border: 2px solid #2c3e50;
      padding: 10px 20px;
      border-radius: 8px;
      background: #ecf0f1;
      transition: background 0.3s, color 0.3s;
      cursor: pointer;
    }
    .game-link:hover {
      background: #2c3e50;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Mushroom Gaming</h1>

  <div class="game-link" onclick="openGame('Run3/index.html')">Play Run 3</div>
  <div class="game-link" onclick="openGame('PaperIo2/index.html')">Play Paper.Io 2</div>
  <div class="game-link" onclick="openGame('Ovo/index.html')">Play OvO</div>
  <div class="game-link" onclick="openGame('SandBoxels/index.html')">Play SandBoxels</div>
  <div class="game-link" onclick="openGame('Evolution/index.html')">Play Evolution</div>
  <div class="game-link" onclick="openGame('DriveMad/index.html')">Play Drive Mad</div>
  <div class="game-link" onclick="openGame('Tetris/index.html')">Play Tetris</div>
  <div class="game-link" onclick="openGame('DriftBoss/index.html')">Play Drift Boss</div>
  <div class="game-link" onclick="openGame('Minecraft/index.html')">Play Minecraft</div>

  <script>
  function openGame(path) {
    const fullPath = `${location.origin}/${path}`;
    fetch(fullPath)
      .then(res => res.text())
      .then(html => {
        const newWin = window.open('about:blank');
        if (!newWin) {
          alert("Popup blocked. Please allow popups for this site.");
          return;
        }

        // Insert base tag to help resolve relative paths
        const basePath = path.replace(/\/[^\/]*$/, '/');
        html = html.replace('<head>', `<head><base href="${basePath}" />`);

        newWin.document.write(html);
        newWin.document.close();
      })
      .catch(err => {
        alert("Failed to load the game.");
        console.error(err);
      });
  }
</script>

</body>
</html>
